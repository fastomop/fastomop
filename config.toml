[models]
# Default for team orchestrators (OMOP Conversation, OMOP Complex, Clinical Imaging Team)
default_provider = "ollama_medgemma_27b"
default_id = "MedAIBase/MedGemma1.0:27b"

[models.providers.anthropic]
provider = "anthropic"
model_id = "claude-3-5-sonnet-20241022"

[models.providers.openai]
provider = "openai"
model_id = "gpt-4-turbo-preview"

[models.providers.azure]
provider = "azure"
model_id = "gpt-4.1"
api_version = "2025-01-01-preview"
temperature = 0.0  # Deterministic responses

[models.providers.ollama]
provider = "ollama"
model_id = "qwen3-coder:30b"

[models.providers.ollama_light]
provider = "ollama"
model_id = "qwen2.5:7b"

# MedGemma 1.5 4b - for imaging agent (vision-capable)
[models.providers.ollama_medgemma]
provider = "ollama"
model_id = "MedAIBase/MedGemma1.5:4b"

# MedGemma 27b - for semantic, database, and team orchestrators
[models.providers.ollama_medgemma_27b]
provider = "ollama"
model_id = "lukaspetrik/gemma3-tools:27b"

[agents.database]
name = "OMOP Database Agent"
model_provider = "ollama_medgemma_27b"
prompt_name = "database_agent"
prompt_label = "dev"
reasoning = false
markdown = false

[agents.semantic]
name = "OMOP Semantic Agent"
model_provider = "ollama_medgemma_27b"
prompt_name = "semantic_agent"
prompt_label = "dev"
reasoning = false  # Disable reasoning - output_schema enforces JSON, reasoning adds explanatory text

[agents.orchestrator]
name = "OMOP Orchestrator"
model_provider = "ollama_medgemma_27b"
prompt_name = "supervisor"
prompt_label = "dev"
reasoning = false

[agents.imaging]
name = "Clinical Imaging Agent"
model_provider = "ollama_medgemma"
prompt_name = "imaging_agent"
prompt_label = "dev"
reasoning = false
markdown = true

[hpc]
host = ""
username = ""
ssh_key_path = ""
port = 22

[omcp]
transport = "stdio"
command = "uv run --directory /path/to/your/omcp-version"

[milvus]
host = "localhost"
port = 19530
collection = "omop_clinical_concepts"
embedding_model = "abhinand/MedEmbed-large-v0.1"

[observability]
tracing_enabled = true
disable_batch = true
